    const filterInput = document.getElementById("filterInput");
    const outputBox = document.getElementById("output");

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
        );
    }

    function renderPriceList(query = "") {
        const cleanQuery = query.trim().toLowerCase();
        let htmlContent = "";
        let totalFound = 0;

        priceData.forEach(section => {
            const filteredItems = section.items.filter(item => 
                item.name.toLowerCase().includes(cleanQuery)
            );

            if (filteredItems.length > 0) {
                htmlContent += `<div class="section-header">${escapeHTML(section.category)}</div>`;
                
                filteredItems.forEach(item => {
                    totalFound++;
                    let displayName = escapeHTML(item.name);
                    
                    if (cleanQuery) {
                        const escapedQuery = cleanQuery.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                        const regex = new RegExp(`(${escapedQuery})`, "gi");
                        displayName = displayName.replace(regex, "<mark>$1</mark>");
                    }

                    htmlContent += `
                        <div class="table-row">
                            <div class="col-name">${displayName}</div>
                            <div class="col-unit">${escapeHTML(item.unit)}</div>
                            <div class="col-price">${escapeHTML(item.price)}</div>
                        </div>
                    `;
                });
            }
        });

        if (totalFound === 0) {
            outputBox.innerHTML = `<div class="placeholder-text">Нічого не знайдено за запитом "${escapeHTML(query)}"</div>`;
        } else {
            outputBox.innerHTML = htmlContent;
        }
    }

    filterInput.addEventListener("input", (e) => {
        renderPriceList(e.target.value);
    });

    renderPriceList();
