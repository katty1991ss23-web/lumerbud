<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumirbud</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>

    <div class="dark-block">

        <!-- ФОТО-ФОН: вертикальне для екранів, що стоять "стовпчиком", широке для решти -->
        <picture class="responsive-picture">

            <!-- Вертикальне фото: телефон/планшет у вертикальному положенні -->
            <source
                media="(orientation: portrait)"
                srcset="tre/56.jpg"
            >

            <!-- Широке фото: комп'ютер і телефон на боці -->
            <img
                src="tre/p.png"
                class="bg-video"
                alt="Інтер'єр вітальні"
                decoding="async"
                fetchpriority="high"
            >

        </picture>

        <!-- КНОПКА ПЕРЕХОДУ НА САЙТ -->
        <div class="block-content">
            <a
                href="https://lumirbud.com.ua/"
                class="btn-cta"
            >
                Перейти на сайт
            </a>
        </div>

    </div>

    <!-- price BUTTON -->
    <a href="price.html" target="_blank" class="price-circle-btn">Ціни</a>
</body>
</html>
